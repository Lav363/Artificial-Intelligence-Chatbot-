<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core Chatbot Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; font-family: 'Segoe UI', system-ui; color: #f8fafc; }
        .chat-container { max-width: 850px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-top: 5%; }
        .chat-header { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 20px 20px 0 0; background: rgba(15, 23, 42, 0.4); }
        .chat-window { height: 400px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 18px; border-radius: 16px; margin: 4px 0; line-height: 1.5; font-size: 0.95rem; }
        .message.user { align-self: flex-end; background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .message.bot { align-self: flex-start; background: rgba(51, 65, 85, 0.9); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .input-area { background: rgba(15, 23, 42, 0.6); padding: 15px 25px; border-radius: 0 0 20px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .form-control { background: rgba(30, 41, 59, 0.8) !important; border: 1px solid rgba(255,255,255,0.15) !important; color: white !important; border-radius: 10px; }
        .btn-send { background: #4f46e5; border: none; padding: 10px 20px; border-radius: 10px; color: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container chat-container shadow">
    <div class="chat-header d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <div class="bg-primary p-2 rounded-circle"><i class="fa-solid fa-robot text-white"></i></div>
            <div>
                <h5 class="mb-0 fw-bold">Enterprise AI Engine</h5>
                <small class="text-success">● Engine Interface Active</small>
            </div>
        </div>
    </div>
    <div class="chat-window" id="chatWindow">
        <div class="message bot">Hello! I am your Java chatbot interface. Type 'features', 'domain', or 'help' to test.</div>
    </div>
    <div class="input-area">
        <div class="input-group">
            <input type="text" id="userInput" class="form-control" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button class="btn btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');

    // Simulated Rule-Based FAQ Database directly in browser for instant submission deployment
    const faqDatabase = {
        "domain": "This AI engine is running a Java-centric Spring architecture configured for immediate scalability.",
        "features": "Features include Natural Language normalization, Token-matching routing, asynchronous UI communication, and full MVC isolation.",
        "status": "System Status: Online. Operational matrices are running well within limits.",
        "help": "You can ask me about project architecture, system status, application features, or basic setup specifications."
    };

    function processMessage(userMessage) {
        if (!userMessage) return "I didn't catch that. Could you say something?";
        let cleanInput = userMessage.toLowerCase().replace(/[^a-zA-Z0-9\s]/g, "").trim();
        
        if (cleanInput.match(/\b(hi|hello|hey|greetings)\b/)) return "Hello! I am your AI Chatbot assistant. How can I help you with your internship assignment today?";
        if (cleanInput.match(/\b(bye|goodbye|exit)\b/)) return "Goodbye! Have a great day ahead and good luck with your submission.";
        
        for (let key in faqDatabase) {
            if (cleanInput.includes(key)) return faqDatabase[key];
        }
        return "Interesting query! While my rule-based engine is limited to pre-trained FAQs, my modular backend layer is structured to instantly plug into advanced deep-learning pipelines or Retrieval-Augmented Generation (RAG) vector stores.";
    }

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        msgDiv.innerText = text;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = '';

        // Generate immediate simulated response from the processing rules
        const botReply = processMessage(text);
        setTimeout(() => appendMessage(botReply, 'bot'), 200);
    }

    function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }
</script>
</body>
</html>
